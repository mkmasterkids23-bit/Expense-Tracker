<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
    --danger: #ef4444;
    --success: #34d399;
    --warn: #f59e0b;
    --warn-light: #fcd34d;
    --warn-dark: #b45309;
    --blue: #818cf8;
    --font: 'Inter', system-ui, sans-serif;
  }

  body.dark {
    --bg: #0f172a; 
    --card: #1e293b; 
    --border: #334155; 
    --text: #f1f5f9; 
    --sub: #94a3b8;
    --muted: #475569; 
    --input: #0f172a; 
    --inputBorder: #334155; 
    --hover: #334155;
    --progressBg: #334155; 
    --badge: #334155; 
    --badgeText: #94a3b8;
    --bg-glow-1: rgba(99, 102, 241, 0.15);
    --bg-glow-2: rgba(139, 92, 246, 0.15);
    --card-shadow: 0 4px 20px rgba(0,0,0,0.25);
    
    --banner-dn-bg: #450a0a;
    --banner-dn-border: #991b1b;
    --banner-dn-title: #ef4444;
    --banner-dn-desc: #fca5a5;
    
    --banner-wn-bg: #422006;
    --banner-wn-border: #92400e;
    --banner-wn-title: #f59e0b;
    --banner-wn-desc: #fcd34d;
    
    --edit-bg: #1e3a5f;
    --edit-border: #1d4ed8;
  }

  body.light {
    --bg: #f1f5f9; 
    --card: #ffffff; 
    --border: #e2e8f0; 
    --text: #1e293b; 
    --sub: #64748b;
    --muted: #94a3b8; 
    --input: #f8fafc; 
    --inputBorder: #e2e8f0; 
    --hover: #f8fafc;
    --progressBg: #e2e8f0; 
    --badge: #f1f5f9; 
    --badgeText: #64748b;
    --bg-glow-1: rgba(99, 102, 241, 0.1);
    --bg-glow-2: rgba(139, 92, 246, 0.1);
    --card-shadow: 0 2px 8px rgba(0,0,0,0.05);

    --banner-dn-bg: #fef2f2;
    --banner-dn-border: #fecaca;
    --banner-dn-title: #ef4444;
    --banner-dn-desc: #dc2626;

    --banner-wn-bg: #fffbeb;
    --banner-wn-border: #fde68a;
    --banner-wn-title: #f59e0b;
    --banner-wn-desc: #b45309;

    --edit-bg: #eff6ff;
    --edit-border: #bfdbfe;
  }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }

  .bg-animation {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    background: radial-gradient(circle at 15% 50%, var(--bg-glow-1), transparent 35%),
                radial-gradient(circle at 85% 30%, var(--bg-glow-2), transparent 35%);
    filter: blur(60px);
    animation: floatingGlow 12s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes floatingGlow {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.1) translate(2%, 4%); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
    margin-bottom: 20px;
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    opacity: 0;
    animation: fadeInUp 0.5s ease-out forwards;
  }
  
  .card-h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  /* Header styles */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--primary-grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { margin: 0; font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .header-subtitle { margin: 4px 0 0 46px; color: var(--sub); font-size: 12px; }

  .header-controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }

  select, input, button {
    font-family: var(--font);
  }

  .select-styled {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }

  .budget-wrap {
    display: flex; align-items: center; gap: 6px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    transition: all 0.2s;
  }
  .budget-wrap span { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .budget-wrap input {
    border: none; outline: none; width: 80px; font-size: 13px; color: var(--text);
    background: transparent; text-align: right;
  }

  .theme-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; font-size: 16px; color: var(--text); transition: all 0.2s;
  }

  /* Banners */
  .banner {
    border-radius: 12px; padding: 14px 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
    animation: fadeInUp 0.4s ease-out forwards;
  }
  .banner .icon { font-size: 22px; }
  .banner.over { background: var(--banner-dn-bg); border: 1px solid var(--banner-dn-border); }
  .banner.over .title { font-weight: 700; color: var(--banner-dn-title); font-size: 14px; }
  .banner.over .desc { color: var(--banner-dn-desc); font-size: 13px; }
  .banner.warn { background: var(--banner-wn-bg); border: 1px solid var(--banner-wn-border); }
  .banner.warn .title { font-weight: 700; color: var(--banner-wn-title); font-size: 14px; }
  .banner.warn .desc { color: var(--banner-wn-desc); font-size: 13px;}

  /* Summaries */
  .summary-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--card); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--card-shadow); border: 1px solid var(--border);
    position: relative; overflow: hidden; transition: all 0.3s;
  }
  .summary-line {
    position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0;
  }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .summary-label { font-size: 11px; color: var(--sub); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .summary-val { font-size: 18px; font-weight: 800; color: var(--text); }
  .summary-icon { font-size: 22px; opacity: .7; }

  /* Budget Bar */
  .budget-bar-wrap { margin-bottom: 20px; }
  .bbar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .bbar-left { display: flex; align-items: center; gap: 8px; }
  .bbar-label { font-weight: 700; font-size: 13px; color: var(--text); }
  .bbar-amt { font-size: 12px; color: var(--sub); }
  .bbar-stat { font-size: 13px; font-weight: 700; }
  .bbar-bg { background: var(--progressBg); border-radius: 99px; height: 10px; overflow: hidden; }
  .bbar-fill { height: 100%; border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1), background 0.3s; }
  .bbar-markers { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* Bulk Add */
  .grid-header {
    display: grid; grid-template-columns: 1fr 160px 160px 36px; gap: 8px; margin-bottom: 8px;
  }
  .grid-header div { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
  .bulk-row {
    display: grid; grid-template-columns: 1fr 160px 160px 36px; gap: 8px; margin-bottom: 8px;
  }
  .bulk-inp, .bulk-sel {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--inputBorder);
    font-size: 13px; color: var(--text); background: var(--input); outline: none; width: 100%; box-sizing: border-box; transition: all 0.2s;
  }
  .bulk-inp.err { border-color: var(--danger); }
  .btn-del {
    background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0 10px; height: 36px; transition: 0.2s;
  }
  .btn-del:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-light); }
  
  .bulk-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn-add-row {
    background: none; color: var(--blue); border: 1px solid var(--blue); border-radius: 8px;
    padding: 9px 18px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
  }
  .btn-add-row:hover { background: rgba(129, 140, 248, 0.1); }
  .btn-save-all {
    background: var(--primary-grad); color: #fff; border: none; border-radius: 8px;
    padding: 9px 20px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(99,102,241,0.25); transition: 0.2s;
  }
  .btn-save-all:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Charts & Bars */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .empty-state { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; flex-direction: column; gap: 8px; }
  
  .cat-bar-item { margin-bottom: 12px; }
  .cat-bar-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .cat-bar-name { display: flex; align-items: center; gap: 6px; }
  .cat-bar-dot { width: 8px; height: 8px; border-radius: 50%; }
  .cat-bar-bg { background: var(--progressBg); border-radius: 99px; height: 6px; }
  .cat-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  /* Expenses List */
  .exp-grid-header { display: grid; grid-template-columns: 1fr 130px 140px 90px; gap: 8px; margin-bottom: 10px; padding-left: 4px; }
  .exp-grid-header div { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
  .exp-list { display: flex; flex-direction: column; gap: 6px; }

  .exp-item {
    display: grid; grid-template-columns: 1fr 130px 140px 90px; gap: 8px; align-items: center;
    padding: 11px 14px; background: var(--hover); border-radius: 10px; border: 1px solid var(--border); transition: background 0.15s;
  }
  .exp-item:hover { transform: translateX(2px); }
  .exp-name-wrap { display: flex; align-items: center; gap: 9px; }
  .exp-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .exp-name { font-size: 13px; color: var(--text); font-weight: 600; }
  .exp-badge { font-size: 12px; padding: 3px 8px; background: var(--badge); color: var(--badgeText); border-radius: 6px; width: fit-content; font-weight: 500; }
  .exp-amt { font-size: 14px; font-weight: 700; color: var(--text); }
  .exp-actions { display: flex; gap: 5px; }
  .btn-icon { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 7px; padding: 5px 9px; cursor: pointer; font-size: 13px; transition: 0.2s; }
  .btn-icon:hover { background: var(--border); color: var(--text); }
  .btn-icon.del { border-color: var(--danger-light); color: var(--danger); }
  .btn-icon.del:hover { background: var(--danger-light); border-color: rgba(239, 68, 68, 0.4); }

  .exp-edit-item {
    display: grid; grid-template-columns: 1fr 130px 140px 90px; gap: 8px; align-items: center;
    background: var(--edit-bg); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--edit-border);
  }
  .btn-save { background: var(--primary-grad); color: #fff; border: none; border-radius: 7px; padding: 6px 10px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .btn-cancel { background: none; border: 1px solid var(--border); color: var(--sub); border-radius: 7px; padding: 6px 10px; font-size: 12px; cursor: pointer; }

  @media (max-width: 600px) {
    .summary-grid, .chart-grid { grid-template-columns: 1fr; }
    .grid-header, .bulk-row, .exp-grid-header, .exp-item, .exp-edit-item {
       grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="bg-animation"></div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-left">
        <div class="header-icon">💰</div>
        <h1 class="header-title">Expense Dashboard</h1>
      </div>
      <p class="header-subtitle">Rates approximate · Stored in OMR</p>
    </div>
    <div class="header-controls">
      <select id="month-sel" class="select-styled"></select>
      <select id="currency-sel" class="select-styled" style="min-width: 120px;"></select>
      <div class="budget-wrap">
        <span id="budget-label">Budget</span>
        <input id="budget-inp" type="number" min="0" placeholder="—">
      </div>
      <button id="theme-toggle" class="theme-btn" title="Toggle theme">☀️</button>
    </div>
  </div>

  <!-- Banners Content -->
  <div id="banners-container"></div>

  <!-- Summary Cards -->
  <div class="summary-grid" id="summary-container" style="animation-delay: 0.1s;"></div>

  <!-- Budget Bar -->
  <div id="budget-bar-container" style="animation-delay: 0.15s;"></div>

  <!-- Bulk Add -->
  <div class="card" style="animation-delay: 0.2s;">
    <h2 class="card-h2">➕ Add Expenses</h2>
    <div class="grid-header">
      <div>Expense Name</div><div id="bulk-amt-label">Amount</div><div>Category</div><div></div>
    </div>
    <div id="bulk-rows-container"></div>
    <div class="bulk-actions">
      <button class="btn-add-row" onclick="addRow()">+ Add Row</button>
      <button class="btn-save-all" onclick="submitRows()">Save All Expenses</button>
    </div>
  </div>

  <!-- Chart + Bars -->
  <div class="chart-grid">
    <div class="card" style="animation-delay: 0.25s;">
      <h2 class="card-h2">📊 Breakdown</h2>
      <div id="chart-container" style="height: 220px; position: relative;"></div>
    </div>
    <div class="card" style="animation-delay: 0.3s;">
      <h2 class="card-h2">📂 By Category</h2>
      <div id="bars-container"></div>
    </div>
  </div>

  <!-- Expenses List -->
  <div class="card" style="animation-delay: 0.35s;">
    <h2 class="card-h2">
      🧾 <span id="exp-month-label"></span> Expenses <span id="exp-count-label" style="color:var(--muted);font-weight:400;font-size:13px"></span>
    </h2>
    <div id="expenses-container"></div>
  </div>
</div>

<script>
  // ── CONSTANTS & UTILS ──
  const CATEGORIES = ["Rent","Food","Transport","Entertainment","Health","Shopping","Utilities","Other"];
  const CAT_COLORS = { Rent:"#818cf8",Food:"#fbbf24",Transport:"#34d399",Entertainment:"#f472b6",Health:"#2dd4bf",Shopping:"#fb923c",Utilities:"#60a5fa",Other:"#a78bfa" };
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const CURRENCIES = [
    {code:"OMR",symbol:"OMR",rate:1,name:"Omani Rial"},
    {code:"USD",symbol:"$",rate:2.6,name:"US Dollar"},
    {code:"EUR",symbol:"€",rate:2.38,name:"Euro"},
    {code:"GBP",symbol:"£",rate:2.03,name:"British Pound"},
    {code:"AED",symbol:"AED",rate:9.55,name:"UAE Dirham"},
    {code:"SAR",symbol:"SAR",rate:9.75,name:"Saudi Riyal"},
    {code:"INR",symbol:"₹",rate:216,name:"Indian Rupee"},
    {code:"PKR",symbol:"₨",rate:724,name:"Pakistani Rupee"},
  ];

  const fmtAmt = (omr, cur) => {
    const v = omr * cur.rate;
    return `${cur.symbol} ${v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  };
  const blankRow = () => ({id:Date.now()+Math.random(),name:"",amount:"",category:"Food"});
  const escapeHTML = str => str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag] || tag));

  // ── STATE ──
  let state = {
    dark: true,
    month: MONTHS[new Date().getMonth()],
    expenses: [],
    rows: [blankRow()],
    currency: CURRENCIES[0],
    editId: null,
    editData: {},
    errors: {},
    budget: "" // as string
  };

  // ── COMPUTED ──
  const getTotal = () => state.expenses.reduce((s,e) => s + e.amountOMR, 0);
  const getByCategory = () => {
    const map = {};
    state.expenses.forEach(e => { map[e.category] = (map[e.category]||0) + e.amountOMR; });
    return Object.entries(map).map(([name,value]) => ({name, value})).sort((a,b)=>b.value-a.value);
  };

  // ── INIT & EVENT BINDINGS ──
  function init() {
    // Theme toggle
    document.getElementById('theme-toggle').onclick = () => {
      state.dark = !state.dark;
      document.body.className = state.dark ? "dark" : "light";
      document.getElementById('theme-toggle').innerText = state.dark ? "☀️" : "🌙";
      updateChart(); // Colors might change
    };
    document.body.className = state.dark ? "dark" : "light";
    document.getElementById('theme-toggle').innerText = state.dark ? "☀️" : "🌙";

    // Setup Month dropdown
    const monthSel = document.getElementById('month-sel');
    monthSel.innerHTML = MONTHS.map(m => `<option ${m===state.month?'selected':''}>${m}</option>`).join('');
    monthSel.onchange = e => { state.month = e.target.value; updateAll(); };

    // Setup Currency dropdown
    const curSel = document.getElementById('currency-sel');
    curSel.innerHTML = CURRENCIES.map(c => `<option value="${c.code}">${c.code} – ${c.name}</option>`).join('');
    curSel.onchange = e => { 
      state.currency = CURRENCIES.find(c => c.code === e.target.value); 
      document.getElementById('budget-label').innerText = `Budget (${state.currency.code})`;
      document.getElementById('bulk-amt-label').innerText = `Amount (${state.currency.code})`;
      updateAll(); 
    };

    document.getElementById('budget-inp').oninput = e => { state.budget = e.target.value; updateAll(); };
    document.getElementById('budget-label').innerText = `Budget (${state.currency.code})`;
    document.getElementById('bulk-amt-label').innerText = `Amount (${state.currency.code})`;

    renderBulkAdd();
    updateAll();
  }

  // ── ACTIONS & RENDERS ──
  function updateAll() {
    renderBanners();
    renderSummary();
    renderBudgetBar();
    renderChart();
    renderBars();
    renderExpenses();
  }

  function renderBanners() {
    const container = document.getElementById('banners-container');
    const total = getTotal();
    const budgetOMR = state.budget && !isNaN(state.budget) && Number(state.budget)>0 ? Number(state.budget)/state.currency.rate : null;
    const overBudget = budgetOMR !== null && total > budgetOMR;
    const budgetPct = budgetOMR ? Math.min((total/budgetOMR)*100, 100) : 0;
    const remaining = budgetOMR ? budgetOMR - total : null;

    let html = '';
    if (overBudget) {
      html += `
        <div class="banner over">
          <span class="icon">🚨</span>
          <div>
            <div class="title">Over Budget!</div>
            <div class="desc">Exceeded by <strong>${fmtAmt(Math.abs(remaining), state.currency)}</strong> this ${state.month}.</div>
          </div>
        </div>`;
    }
    if (budgetOMR && !overBudget && budgetPct >= 80) {
      html += `
        <div class="banner warn">
          <span class="icon">⚠️</span>
          <div>
            <div class="title">Approaching Limit</div>
            <div class="desc">${Math.round(budgetPct)}% used · <strong>${fmtAmt(remaining, state.currency)}</strong> remaining.</div>
          </div>
        </div>`;
    }
    container.innerHTML = html;
  }

  function renderSummary() {
    const container = document.getElementById('summary-container');
    const total = getTotal();
    const byCat = getByCategory();
    const topCat = byCat.length ? byCat[0].name : "—";
    
    const budgetOMR = state.budget && !isNaN(state.budget) && Number(state.budget)>0 ? Number(state.budget)/state.currency.rate : null;
    const overBudget = budgetOMR !== null && total > budgetOMR;

    const cards = [
      {label:"Total Spent", value:fmtAmt(total,state.currency), color:overBudget?"#ef4444":"#818cf8", icon:"💸"},
      {label:"Top Category", value:topCat, color:"#fbbf24", icon:"🏆"},
      {label:"Transactions", value:state.expenses.length, color:"#34d399", icon:"📋"}
    ];

    container.innerHTML = cards.map(c => `
      <div class="summary-card">
        <div class="summary-line" style="background:${c.color}"></div>
        <div class="summary-top">
          <div>
            <div class="summary-label">${c.label}</div>
            <div class="summary-val">${c.value}</div>
          </div>
          <div class="summary-icon">${c.icon}</div>
        </div>
      </div>
    `).join('');
    
    // adjust gap dynamically based on budgetOMR
    container.style.marginBottom = budgetOMR ? '12px' : '20px';
  }

  function renderBudgetBar() {
    const container = document.getElementById('budget-bar-container');
    const total = getTotal();
    const budgetOMR = state.budget && !isNaN(state.budget) && Number(state.budget)>0 ? Number(state.budget)/state.currency.rate : null;
    
    if (!budgetOMR) { container.innerHTML = ''; return; }

    const overBudget = total > budgetOMR;
    const budgetPct = Math.min((total/budgetOMR)*100, 100);
    const remaining = budgetOMR - total;

    const statColor = overBudget ? "var(--danger)" : budgetPct >= 80 ? "var(--warn)" : "var(--success)";
    const statText = overBudget ? `Over by ${fmtAmt(Math.abs(remaining),state.currency)}` : `${fmtAmt(remaining,state.currency)} left`;
    const bgColor = statColor;

    container.innerHTML = `
      <div class="card budget-bar-wrap">
        <div class="bbar-top">
          <div class="bbar-left">
            <span class="bbar-label">Monthly Budget</span>
            <span class="bbar-amt">${fmtAmt(total,state.currency)} / ${fmtAmt(budgetOMR,state.currency)}</span>
          </div>
          <span class="bbar-stat" style="color:${statColor}">${statText}</span>
        </div>
        <div class="bbar-bg">
          <div class="bbar-fill" style="width:${budgetPct}%; background:${bgColor}"></div>
        </div>
        <div class="bbar-markers">
          <span>0%</span><span>80%</span><span>100%</span>
        </div>
      </div>
    `;
  }

  // BULK ADD
  function addRow() {
    state.rows.push(blankRow());
    renderBulkAdd();
  }

  function removeRow(id) {
    if (state.rows.length === 1) state.rows = [blankRow()];
    else state.rows = state.rows.filter(x => x.id !== id);
    renderBulkAdd();
  }

  function submitRows() {
    const errs = {};
    state.rows.forEach(r => {
      if(!r.name.trim()) errs[r.id+"n"] = true;
      if(!r.amount || isNaN(r.amount) || Number(r.amount) <= 0) errs[r.id+"a"] = true;
    });
    if (Object.keys(errs).length) {
      state.errors = errs;
      renderBulkAdd(); 
      return;
    }
    const newExp = state.rows.map(r => ({
      id: Date.now() + Math.random(),
      name: r.name.trim(),
      amountOMR: Number(r.amount) / state.currency.rate,
      category: r.category
    }));
    state.expenses = [...state.expenses, ...newExp];
    state.rows = [blankRow()];
    state.errors = {};
    renderBulkAdd();
    updateAll();
  }

  function renderBulkAdd() {
    const container = document.getElementById('bulk-rows-container');
    container.innerHTML = state.rows.map(r => `
      <div class="bulk-row">
        <input type="text" class="bulk-inp ${state.errors[r.id+'n']?'err':''}" placeholder="e.g. Netflix" value="${escapeHTML(r.name)}" oninput="updateRow(${r.id}, 'name', this.value)">
        <input type="number" class="bulk-inp ${state.errors[r.id+'a']?'err':''}" placeholder="0.00" min="0" value="${r.amount}" oninput="updateRow(${r.id}, 'amount', this.value)">
        <select class="bulk-sel" onchange="updateRow(${r.id}, 'category', this.value)">
          ${CATEGORIES.map(c => `<option ${c===r.category?'selected':''}>${c}</option>`).join('')}
        </select>
        <button class="btn-del" onclick="removeRow(${r.id})">×</button>
      </div>
    `).join('');
  }

  // Bind to window to access from inline string handlers (lazy way but effective)
  window.updateRow = (id, field, val) => {
    const row = state.rows.find(x => x.id === id);
    if(row) row[field] = val;
  };
  window.addRow = addRow;
  window.removeRow = removeRow;
  window.submitRows = submitRows;

  // CHART
  let chartInst = null;
  function renderChart() {
    const container = document.getElementById('chart-container');
    const byCat = getByCategory();
    
    if (byCat.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="height:210px">
          <span style="font-size:32px;opacity:0.4">🥧</span>
          Add expenses to see chart
        </div>`;
      if(chartInst){ chartInst.destroy(); chartInst=null; }
      return;
    }
    
    // Ensure canvas exists
    if (!document.getElementById("main-chart")) {
      container.innerHTML = `<canvas id="main-chart"></canvas>`;
    }
    
    const ctx = document.getElementById("main-chart").getContext("2d");
    const dLabels = byCat.map(c => c.name);
    const dVals = byCat.map(c => c.value);
    const dColors = byCat.map(c => CAT_COLORS[c.name] || "#a78bfa");
    
    Chart.defaults.color = getComputedStyle(document.body).getPropertyValue('--sub').trim() || '#64748b';
    Chart.defaults.font.family = "'Inter', sans-serif";

    if (chartInst) {
      chartInst.data.labels = dLabels;
      chartInst.data.datasets[0].data = dVals;
      chartInst.data.datasets[0].backgroundColor = dColors;
      // Chart uses global default color for text, need to refresh legend explicitly if it supports it, 
      // but modifying defaults usually applies on next render/update.
      chartInst.update();
    } else {
      chartInst = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: dLabels,
          datasets: [{ data: dVals, backgroundColor: dColors, borderWidth: 0, hoverOffset: 4 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '60%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { usePointStyle: true, boxWidth: 8, font: {size: 11} }
            },
            tooltip: {
              callbacks: {
                label: function(ctx) { return ' ' + fmtAmt(ctx.raw, state.currency); }
              }
            }
          }
        }
      });
    }
  }

  // Update chart when theme changes
  window.updateChart = renderChart;

  // CATEGORY BARS
  function renderBars() {
    const container = document.getElementById('bars-container');
    const byCat = getByCategory();
    const total = getTotal();

    if (byCat.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="height:180px">
          <span style="font-size:32px;opacity:0.4">📂</span>
          No data yet
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${byCat.map(c => {
          const color = CAT_COLORS[c.name] || "#a78bfa";
          const pct = total ? Math.round((c.value/total)*100) : 0;
          return `
            <div class="cat-bar-item">
              <div class="cat-bar-info">
                <div class="cat-bar-name">
                  <div class="cat-bar-dot" style="background:${color}"></div>
                  <span style="font-weight:600;color:var(--text)">${c.name}</span>
                </div>
                <span style="color:var(--sub)">${fmtAmt(c.value,state.currency)} <span style="color:var(--muted)">· ${pct}%</span></span>
              </div>
              <div class="cat-bar-bg">
                <div class="cat-bar-fill" style="background:${color}; width:${pct}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // EXPENSES LIST
  window.startEdit = function(id) {
    const e = state.expenses.find(x => x.id === id);
    state.editId = id;
    state.editData = {name: e.name, amountOMR: e.amountOMR, category: e.category};
    renderExpenses();
  }
  window.cancelEdit = function() {
    state.editId = null; state.editData = {};
    renderExpenses();
  }
  window.saveEdit = function(id) {
    const d = state.editData;
    if(!d.name.trim() || !d.amountOMR || Number(d.amountOMR)<=0) return;
    state.expenses = state.expenses.map(e => e.id === id ? {...e, ...d, amountOMR: Number(d.amountOMR)} : e);
    state.editId = null;
    updateAll();
  }
  window.removeExpense = function(id) {
    state.expenses = state.expenses.filter(e => e.id !== id);
    if(state.editId === id) state.editId = null;
    updateAll();
  }
  window.editInputName = val => state.editData.name = val;
  window.editInputCat = val => state.editData.category = val;
  window.editInputAmt = val => state.editData.amountOMR = Number(val) / state.currency.rate;

  function renderExpenses() {
    document.getElementById('exp-month-label').innerText = state.month;
    document.getElementById('exp-count-label').innerText = state.expenses.length > 0 ? `(${state.expenses.length})` : '';

    const container = document.getElementById('expenses-container');
    
    if (state.expenses.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="padding:32px 0;">
          <span style="font-size:36px;opacity:0.3">🧾</span>
          No expenses yet — add your first ones above!
        </div>
      `;
      return;
    }

    let html = `
      <div class="exp-grid-header">
        <div>Name</div><div>Category</div><div>Amount</div><div></div>
      </div>
      <div class="exp-list">
    `;

    [...state.expenses].reverse().forEach(e => {
      if (state.editId === e.id) {
        const amtStr = (state.editData.amountOMR * state.currency.rate).toFixed(2);
        html += `
          <div class="exp-edit-item">
            <input type="text" class="bulk-inp" value="${escapeHTML(state.editData.name)}" oninput="editInputName(this.value)">
            <select class="bulk-sel" onchange="editInputCat(this.value)">
              ${CATEGORIES.map(c => `<option ${c===state.editData.category?'selected':''}>${c}</option>`).join('')}
            </select>
            <input type="number" class="bulk-inp" min="0" value="${amtStr}" oninput="editInputAmt(this.value)">
            <div class="exp-actions">
              <button class="btn-save" onclick="saveEdit(${e.id})">Save</button>
              <button class="btn-cancel" onclick="cancelEdit()">✕</button>
            </div>
          </div>
        `;
      } else {
        const color = CAT_COLORS[e.category] || "#a78bfa";
        html += `
          <div class="exp-item">
            <div class="exp-name-wrap">
              <div class="exp-dot" style="background:${color};box-shadow:0 0 6px ${color}80"></div>
              <span class="exp-name">${escapeHTML(e.name)}</span>
            </div>
            <span class="exp-badge">${e.category}</span>
            <span class="exp-amt">${fmtAmt(e.amountOMR, state.currency)}</span>
            <div class="exp-actions">
              <button class="btn-icon" onclick="startEdit(${e.id})" title="Edit">✏️</button>
              <button class="btn-icon del" onclick="removeExpense(${e.id})" title="Delete">×</button>
            </div>
          </div>
        `;
      }
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  // Run on load
  init();
</script>
</body>
</html>
